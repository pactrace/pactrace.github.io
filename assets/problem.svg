<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
<title id="title">PacTrace evidence consistency problem</title>
<desc id="desc">Current source snapshot S105, search derived from S102, and a live API observation feed PacTrace, which applies a zero-lag contract and requires fallback.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#64748b"/></marker>
</defs>
<rect width="1320" height="760" rx="34" fill="#f8fafc"/>
<text x="70" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#0f172a">Three valid observations. One inconsistent state.</text>
<text x="70" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#64748b">PacTrace checks compatibility before the application reasons across them.</text>

<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect x="70" y="175" width="320" height="170" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="104" y="215" font-size="14" font-weight="800" letter-spacing="1.5" fill="#2563eb">SOURCE OF TRUTH</text>
  <text x="104" y="258" font-size="27" font-weight="750" fill="#0f172a">Orders / Iceberg</text>
  <text x="104" y="297" font-size="19" fill="#475569">Current snapshot</text>
  <rect x="274" y="276" width="80" height="34" rx="10" fill="#dbeafe"/>
  <text x="314" y="299" text-anchor="middle" font-size="17" font-weight="800" fill="#1d4ed8">S105</text>

  <rect x="500" y="175" width="320" height="170" rx="24" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="534" y="215" font-size="14" font-weight="800" letter-spacing="1.5" fill="#b45309">DERIVED SYSTEM</text>
  <text x="534" y="258" font-size="27" font-weight="750" fill="#0f172a">Order search</text>
  <text x="534" y="297" font-size="19" fill="#475569">Derived from source</text>
  <rect x="704" y="276" width="80" height="34" rx="10" fill="#fef3c7"/>
  <text x="744" y="299" text-anchor="middle" font-size="17" font-weight="800" fill="#92400e">S102</text>

  <rect x="930" y="175" width="320" height="170" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="964" y="215" font-size="14" font-weight="800" letter-spacing="1.5" fill="#475569">LIVE EVIDENCE</text>
  <text x="964" y="258" font-size="27" font-weight="750" fill="#0f172a">Provider API</text>
  <text x="964" y="297" font-size="19" fill="#475569">Observed</text>
  <rect x="1065" y="276" width="146" height="34" rx="10" fill="#f1f5f9"/>
  <text x="1138" y="299" text-anchor="middle" font-size="17" font-weight="800" fill="#334155">21 seconds ago</text>
</g>

<path d="M230 345V410H560" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M660 345V410" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1090 345V410H760" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="430" y="435" width="460" height="190" rx="28" fill="#0f172a"/>
<text x="472" y="478" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="1.5" fill="#93c5fd">PACTRACE</text>
<text x="472" y="518" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="750" fill="#ffffff">Consistency contract</text>
<text x="472" y="558" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#cbd5e1">order_search: max source lag = 0</text>
<rect x="472" y="580" width="175" height="42" rx="12" fill="#451a03" stroke="#f59e0b"/>
<text x="560" y="607" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#fbbf24">FALLBACK REQUIRED</text>
<text x="675" y="607" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#cbd5e1">Search is behind the required source state.</text>

<text x="70" y="698" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#64748b">Availability is not freshness. Tool success is not cross-system consistency.</text>
</svg>
